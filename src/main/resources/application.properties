spring.application.name=store
server.port=9193

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.datasource.url=jdbc:mariadb://localhost:3306/bumsoap?allowMultiQueries=true
# application.properties 예시
spring.datasource.username=bumsoap
spring.datasource.password=${BUMSOAP_PWD}

spring.jpa.show-sql= false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=require
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
## create, update, validate(for production)
spring.jpa.hibernate.ddl-auto=update

#logging.level.org.hibernate.SQL=ERROR
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 전체 로그 레벨을 INFO로 설정 (DEBUG 숨김)
logging.level.root=INFO

# 특정 패키지(예: Spring Web, Hibernate 등)의 DEBUG 로그만 숨길 경우
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

management.endpoints.web.exposure.include=mappings

## 604800 = 7 * 24 * 60 * 60 // RT expires in 1 week (unit: sec)
auth.refresh.expirationSec=604800
## 180 = 3 * 60 // RT expires in 3 minutes (unit: sec)
#auth.refresh.expirationSec=180

## 900000 = 15 min * 60 sec * 1000 ms // AT expires in 15 minutes(unit: ms)
auth.token.expirationMs=900000
## 30000 = 30 sec * 1000 ms // AT expires in 30 seconds(unit: ms)
#auth.token.expirationMs=30000

auth.token.jwtSecret=36763979244226452948404D635166546A576D5A7134743777217A25432A462D

frontend.base.url = ${FRONTEND_BASE_URL}

#spring.security.user.name=${SECURITY_USERNAME:bumsoap}
#spring.security.user.password=${SECURITY_PASSWORD:1234}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}
logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

# GOOGLE
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID_GOOGLE}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET_GOOGLE}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile
spring.security.oauth2.client.registration.google.scope[2]=https://www.googleapis.com/auth/user.phonenumbers.read
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# ???
spring.security.oauth2.client.registration.naver.client-id=${CLIENT_ID_NAVER}
spring.security.oauth2.client.registration.naver.client-secret=${CLIENT_SECRET_NAVER}
spring.security.oauth2.client.registration.naver.redirect-uri=${NAVER_REDIRECT_URI}
spring.security.oauth2.client.registration.naver.scope[0]=email
spring.security.oauth2.client.registration.naver.scope[1]=name
spring.security.oauth2.client.registration.naver.scope[2]=nickname
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

# ????? json?? ??? response?? ???? ???? ??? ?
spring.security.oauth2.client.provider.naver.user-name-attribute=response

server.forward-headers-strategy=native

cookie.domain=${COOKIE_DOMAIN}
cookie.secure=${COOKIE_SECURE}
cookie.same-site=${COOKIE_SAMESITE}

# Question/reply/review post size max:
spring.servlet.multipart.max-file-size=5MB
# HTTP
spring.servlet.multipart.max-request-size=5MB

aws.region=ap-northeast-2
aws.s3.bucket=bum-soap-media-905418381044-ap-northeast-2-an
aws.s3.public-url=https://bum-soap-media-905418381044-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com

# uploadRateLimiter 라는 이름의 RateLimiter 설정
resilience4j.ratelimiter.instances.presignedUrl.limitForPeriod=10
resilience4j.ratelimiter.instances.presignedUrl.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.presignedUrl.timeoutDuration=0s