spring.security.oauth2.client.registration.google.redirect-uri=https://www.bum-soap.com/login/oauth2/code/google
spring.security.oauth2.client.registration.naver.redirect-uri=https://www.bum-soap.com/login/oauth2/code/naver
frontend.base.url=https://www.bum-soap.com

cookie.domain=.bum-soap.com
cookie.secure=true
cookie.same-site=Lax

server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=true

## 604800 = 7 * 24 * 60 * 60 // RT expires in 1 week (unit: sec)
auth.refresh.expirationSec=604800

## 900000 = 15 min * 60 sec * 1000 ms // AT expires in 15 minutes(unit: ms)
auth.token.expirationMs=900000
